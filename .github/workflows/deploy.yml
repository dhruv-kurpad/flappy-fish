# Stage 1: unit/mocked tests (validate the commit).
# Stage 2: deploy (only if Stage 1 passes; main / manual only).
# Stage 3: live Azure smoke against the URL just deployed.
# Secrets: Settings → Secrets and variables → Actions
name: CI/CD FlappyFish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Unique tag per commit so ACI must pull new images ( :latest alone is not enough )
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Stage 1 — Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install system deps for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run functional tests (unit / mocked; no live Azure)
        working-directory: src
        run: python -m unittest test_functional_stub -v

  deploy:
    name: Stage 2 — Deploy
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure CLI Login
        run: |
          az login --service-principal \
            -u ${{ secrets.AZURE_CLIENT_ID }} \
            -p ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: ACR Login
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            --username ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build & Push Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend:latest \
            -f frontend/Dockerfile.react \
            --push ./frontend

      - name: Build & Push Flask API
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/flask-api:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/flask-api:latest \
            -f src/Dockerfile.web \
            --push ./src

      - name: Build & Push Game Server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/game-server:${{ env.IMAGE_TAG }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/game-server:latest \
            -f src/Dockerfile.game \
            --push ./src

      - name: Deploy to Azure Container Instances
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file azuredeploy.json \
            --parameters acrServer=${{ secrets.ACR_LOGIN_SERVER }} \
                         acrUsername=${{ secrets.ACR_USERNAME }} \
                         acrPassword=${{ secrets.ACR_PASSWORD }} \
                         sqlUsername=${{ secrets.SQL_USERNAME }} \
                         sqlPassword=${{ secrets.SQL_PASSWORD }} \
                         frontendImage=frontend:${{ env.IMAGE_TAG }} \
                         flaskApiImage=flask-api:${{ env.IMAGE_TAG }} \
                         gameServerImage=game-server:${{ env.IMAGE_TAG }}

      - name: Restart container group (pull fresh images)
        run: |
          az container restart \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name flappy-fish

  smoke:
    name: Stage 3 — Azure smoke
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install system deps for pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Wait for ACI to come back up
        run: sleep 45

      - name: Run live Azure E2E smoke tests
        working-directory: src
        env:
          RUN_AZURE_E2E: "1"
        run: |
          python -m unittest \
            test_functional_stub.TestEndToEndLocalStack \
            test_functional_stub.TestEndToEndAzureDeployment \
            -v
